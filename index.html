<!DOCTYPE html>

<html>
<head>

</head>

<body>
  <h1> Τοπική αποθήκευση </h1>

  <div id="askName" style="display:none;">
<h2>Πως σε λένε? </h2>
<input type="text" id="nameInput" placeholder="Γράψε όνομα">
<button onclick="saveName()"> Συνέχεια </button>
  </div>


  <div id="welcome" style="display:none;">
    <h2 id="welcomeText"> </h2>
    <button onclick="changeName()"> Αλλαγή ονόματος </button>
</div>


<script>
window.onload = function() {

  checkUser();
}

function checkUser() {
   const savedName = localStorage.getItem("username");

   if (savedName) {
    document.getElementById("askName").style.display="none";
    document.getElementById("welcome").style.display="block";
    document.getElementById("welcomeText").innerText = "Γειά σου " + savedName;

   }
   else {
     document.getElementById("askName").style.display="block";
     document.getElementById("welcome").style.display="none";

   }
}


function saveName() {
const name = document.getElementById('nameInput').value.trim();

if (name !=="") {
localStorage.setItem("username",name);
checkUser();

}
}




function changeName() {

localStorage.removeItem("username",name);
document.getElementById("nameInput").value="";
checkUser();


}


</script>

</body>



</html>
